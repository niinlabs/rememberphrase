# Serves the built Rememberphrase app in the rememberphrase-web container.
#
# Listens on 8080 rather than 80 and writes its pid to /tmp, so the master can
# run as uid 101 instead of root (see the Dockerfile).

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout combined;
  sendfile      on;
  gzip          on;
  # text/plain covers the EFF wordlist, which is the largest asset by far.
  gzip_types    text/css application/javascript text/plain;
  gzip_min_length 1024;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # no-store on everything, matching the policy vite.config.ts declares for
    # production. Vite's asset names are content-hashed, so this costs
    # revalidation rather than correctness, and a generated phrase must not
    # survive in a disk cache.
    add_header Cache-Control "no-store" always;
    include /etc/nginx/security-headers.conf;

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
