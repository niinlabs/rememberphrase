# Security headers for Rememberphrase.
#
# The Content-Security-Policy, Referrer-Policy and Permissions-Policy below are
# copied verbatim from the `headers` block in vite.config.ts, which applies them
# to `vite preview` so the browser tests run under the production rules. Nothing
# served them in production until this file existed: the tests asserted against
# a policy the deployed site did not have.
#
# The policy is the product's main technical guarantee, not decoration. A
# passphrase is generated in the browser and must not be able to leave it:
# `default-src 'none'` with `connect-src 'self'` allows the same-origin
# reachability probe and wordlist fetch and nothing else.

server_tokens off;

add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Not declared in vite.config.ts, and added here because they cost nothing and
# only narrow what the browser will do.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
