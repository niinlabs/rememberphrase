version: 2
updates:
  # Keeps the pinned actions in .github/workflows current. Dependabot updates the commit hash and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Only propose releases at least 7 days old, the same wait pnpm-workspace.yaml sets for packages.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # The npm packages in package.json (all development tools), resolved by pnpm through pnpm-lock.yaml.
  # Versions stay exact, as savePrefix in pnpm-workspace.yaml keeps them.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    cooldown:
      default-days: 7
    ignore:
      # Its Firefox crashes the page during the accessibility checks (2026-11-18); later versions are offered.
      - dependency-name: '@playwright/test'
        versions: ['1.65.0']
    # Minor and patch updates come as one pull request; a major update gets its own, as it may need code changes.
    groups:
      packages:
        update-types: [minor, patch]
